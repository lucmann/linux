name: Release HiKey970 kernel

on:
  push:
    branches:
      - upstream-v2
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc rsync

      - name: Build kernel
        run: |
          make hikey970_defconfig
          make olddefconfig
          make -j$(nproc) Image.gz dtbs

      - name: Verify artifacts
        run: |
          ls -la arch/arm64/boot/Image.gz
          ls -la arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          gh release create "upstream-v2-${SHORT_SHA}" \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb \
            --title "HiKey970 kernel @ ${SHORT_SHA}" \
            --notes "Auto-built from upstream-v2 commit ${SHORT_SHA}\n\n${COMMIT_MSG}"
